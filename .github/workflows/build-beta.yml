name: Build and Push Beta Branch Image

on:
  push:
    branches-ignore:
      - main
      - dependabot/**
    paths-ignore:
      - "README.md"
      - "**/README.md"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-beta-branch:
    runs-on: ubuntu-latest
    env:
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute branch tag
        id: branch_tag
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          safe="$(echo "${branch}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's#[^a-z0-9._-]+#-#g; s#^-+##; s#-+$##')"
          tag="beta-${safe}"
          tag="${tag:0:120}"
          tag="${tag%-}"
          if [[ -z "${tag}" ]]; then
            tag="beta-branch"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Using image tag: ${tag}"

      - name: Create beta-tagged recipe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("recipes/recipe.yml")
          output = Path("recipes/recipe-beta.yml")
          tag = "${{ steps.branch_tag.outputs.tag }}"
          text = source.read_text()

          if re.search(r"^alt-tags:\s*$", text, flags=re.MULTILINE):
            raise SystemExit(
              "recipe.yml already defines alt-tags; update build-beta.yml "
              "to merge branch tags intentionally."
            )

          text, count = re.subn(
            r"^(image-version:\s*.+)$",
            r"\1\nalt-tags:\n  - " + tag,
            text,
            count=1,
            flags=re.MULTILINE,
          )
          if count != 1:
            raise SystemExit("Could not locate image-version in recipes/recipe.yml")

          output.write_text(text)
          print(f"Wrote {output}")
          PY
          sed -n '8,16p' recipes/recipe-beta.yml

      - name: Build and push branch image
        uses: blue-build/github-action@v1.12.0
        with:
          recipe: recipe-beta.yml
          # Preserve the generated recipe-beta.yml from the previous step;
          # the action otherwise re-runs actions/checkout and loses it.
          skip_checkout: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          chunkah: true
