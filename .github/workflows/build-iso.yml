name: Build and Publish Live ISO

on:
  workflow_dispatch:
  # Trigger off the main image build finishing (rather than push: [main]
  # directly) so the ISO always embeds the image that build actually
  # published, instead of racing it and possibly grabbing the prior :latest.
  workflow_run:
    workflows: ["Build and Push Image"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve published image reference
        id: image
        # Matches the ref blue-build/github-action publishes to (recipe name +
        # lowercased repo owner), so a fork's ISO embeds the fork's own image
        # instead of defaulting to whatever's hardcoded in installer/Containerfile.
        run: |
          name="$(grep -m1 '^name:' recipes/recipe.yml | sed 's/^name:[[:space:]]*//')"
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=ghcr.io/${owner}/${name}:latest" >> "$GITHUB_OUTPUT"

      - name: Build installer image
        run: |
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="${{ steps.image.outputs.ref }}" \
            --build-arg INSTALL_IMAGE_PAYLOAD="${{ steps.image.outputs.ref }}" \
            -t localhost/xfce-installer:latest installer/

      - name: Build ISO
        id: build
        # ublue-os/titanoboa has no tagged releases; pinned to main's HEAD as of 2026-07-15.
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/xfce-installer:latest
          iso-dest: xfce-live.iso

      - name: Checksum ISO
        run: |
          sha256sum "${{ steps.build.outputs.iso-dest }}" | tee "${{ steps.build.outputs.iso-dest }}-CHECKSUM"

      # GitHub Releases reject assets over 2GB; this ISO is well past that, so
      # the actual file goes to a normal Actions artifact instead. The
      # iso-latest release holds no binary -- it's kept as a stable,
      # bookmarkable URL whose notes always point at the current run's
      # artifact, since artifact URLs themselves change on every build.
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfce-live-iso
          path: |
            ${{ steps.build.outputs.iso-dest }}
            ${{ steps.build.outputs.iso-dest }}-CHECKSUM
          retention-days: 90

      - name: Update latest-build pointer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=iso-latest
          BUILD_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOTES="Latest live ISO build: commit ${BUILD_SHA}, built $(date -u +%Y-%m-%dT%H:%M:%SZ).

          GitHub Releases can't host this file (it's well over the 2GB
          per-asset limit), so the ISO is attached to the build itself as a
          workflow artifact instead of a release asset.

          **[Click here to open this build's workflow run](${RUN_URL})**,
          then download the \`xfce-live-iso\` artifact from its Summary page.
          Requires a GitHub login; artifacts expire after 90 days (revisit
          this page for a link to the current build if one has expired)."
          TITLE="Live ISO (latest build pointer)"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --title "$TITLE" --notes "$NOTES"
          fi
