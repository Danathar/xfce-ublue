name: Build and Publish Live ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/titanoboa-iso
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build installer image
        run: |
          sudo podman build --cap-add sys_admin --security-opt label=disable \
            -t localhost/xfce-installer:latest installer/

      - name: Build ISO
        id: build
        uses: ublue-os/titanoboa@main
        with:
          image-ref: localhost/xfce-installer:latest
          iso-dest: xfce-live.iso

      - name: Checksum ISO
        run: |
          sha256sum "${{ steps.build.outputs.iso-dest }}" | tee "${{ steps.build.outputs.iso-dest }}-CHECKSUM"

      - name: Publish ISO to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=iso-latest
          NOTES="Automatically built from commit ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ). This release is overwritten on every build; it is not versioned."
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${GITHUB_REPOSITORY}" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title "Live ISO (latest)" --notes "$NOTES"
          fi
          gh release upload "$TAG" \
            "${{ steps.build.outputs.iso-dest }}" "${{ steps.build.outputs.iso-dest }}-CHECKSUM" \
            --repo "${GITHUB_REPOSITORY}" --clobber
