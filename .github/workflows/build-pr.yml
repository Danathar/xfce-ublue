name: Build PR Image

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Build image for PR validation
        uses: blue-build/github-action@v1.11.1
        with:
          recipe: recipe.yml
          push: false
          build_opts: --no-sign
          registry_token: ${{ github.token }}
